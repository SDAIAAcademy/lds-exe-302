<h2>اليوم 1: ما يجتازه النموذج، وما تشهد به الشهادة، وما يثبته الأثر</h2>
<ol>
<li><p>في دفعة من 200 مرشح لاختبار منزلي لموظفي الصيانة، أشّرت أداة كشف على 5 تسليمات. يعلن المورّد إيجابيات كاذبة بنسبة 2%. ماذا تفعل بالتسليمات الخمسة؟</p><ul><li><b>أ.</b> تُسقط الخمسة، فالأداة دقيقة بنسبة 98%</li><li><b>ب.</b> تستدعي منهم فقط من يكتب بغير لغته الأولى</li><li><b>ج.</b> لا قرار عليها، ويُتحقق من مهارة الجميع</li><li><b>د.</b> ترفع عتبة الأداة وتُسقط ما يتجاوزها</li></ul></li>
<li><p>شهادة داخلية لمشرفي المستودعات تدّعي أن حاملها «يحدد سبب فرق الجرد ويوصي بإجراء». أظهر اختبار الانكشاف أن نموذجًا مستضافًا كتب تقرير الفروق المنزلي كاملًا واستوفى معاييره. أين يُشهد على المتطلب؟</p><ul><li><b>أ.</b> في جرد حي أمام مقيِّم، ثم مناقشة لسبب الفرق</li><li><b>ب.</b> في التقرير المنزلي نفسه، مع سطر يمنع المساعد</li><li><b>ج.</b> في اختبار قصير مراقب على مفاهيم الجرد</li><li><b>د.</b> في التقرير المنزلي، مع نموذج إفصاح مرفق به</li></ul></li>
<li><p>أربع شارات لمشرفي المستودعات، كلها موقعة وقابلة للتحقق من حالتها. أيها تدّعي أكثر مما تسمح به معايير منحها؟</p><ul><li><b>أ.</b> «أجرى جردًا حيًّا أمام مقيِّم»، ومربوطة بمهمة واحدة من الدور</li><li><b>ب.</b> «اجتاز اختبارًا مراقبًا في السلامة»، وانتهت صلاحيتها</li><li><b>ج.</b> «نفّذ جردًا واحدًا راجعه مديره»، إفادة عمل بلا شارة</li><li><b>د.</b> «مشرف مستودعات خبير»، بعد مشاهدة مقاطع واختبار آلي يُعاد</li></ul></li>
<li><p>برنامج لمشرفي الورديات رشح له المديرون الأفضل أداء. في الفترة نفسها خُفضت ساعات العمل الإضافية للجميع. انخفض الهدر عند المشاركين 4 نقاط وعند غيرهم نقطتين، والفرق بينهم بعد البرنامج 6 نقاط. أي رقم تعلنه أثرًا للبرنامج؟</p><ul><li><b>أ.</b> 6 نقاط، الفرق بين المجموعتين بعد البرنامج</li><li><b>ب.</b> نقطتان، فرق التغيرين، مع ذكر افتراضه</li><li><b>ج.</b> 4 نقاط، التغير عند المشاركين قبل وبعد</li><li><b>د.</b> لا رقم، فالمشاركون لم يُختاروا بالقرعة</li></ul></li>
<li><p>أعطيت نموذجًا مستضافًا اختبارًا منزليًّا لموظفي المشتريات مع ملفاته، فاجتاز 20 بندًا من 24، وحد الاجتياز 17. ماذا تستنتج؟</p><ul><li><b>أ.</b> الاختبار لم يعد يفرّق المهارة عن المساعد</li><li><b>ب.</b> أن أغلب مرشحي المشتريات استعانوا بمساعد</li><li><b>ج.</b> أن النموذج يملك مهارة موظف مشتريات متمرس فعلًا</li><li><b>د.</b> أن يُرفع حد الاجتياز إلى 21 من 24</li></ul></li>
<li><p>تجهز اختبار انكشاف لدراسة حالة منزلية يأخذ فيها المرشح نصًّا وملف بيانات وأسبوعًا. ماذا تعطي النموذج؟</p><ul><li><b>أ.</b> النص وحده دون الملف، ليكون الاختبار أشد عليه</li><li><b>ب.</b> النص والملف ومعايير التصحيح بتفصيلها الكامل</li><li><b>ج.</b> ملخصًا للحالة يكتبه المدرب بنفسه أولًا</li><li><b>د.</b> النص والملف كما يأخذهما المرشح، دون المفتاح</li></ul></li>
<li><p>أداة كشف يعلن مورّدها إيجابيات كاذبة بنسبة 1%، طُبقت على 300 تسليم كتبها أصحابها كلها: يُتوقع أن تتهم نحو 3 أبرياء.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أدوات كشف النصوص المكتوبة آليًّا تخطئ في الكتّاب بغير لغتهم الأولى بالقدر نفسه الذي تخطئ فيه في غيرهم.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>برنامج تدريبي يريد أن يسمح للمتدربين بالمساعد في التمارين. ماذا تقول الأدلة عن أثر ذلك في الشهادة؟</p><ul><li><b>أ.</b> يُمنع في التمارين، فهو يضر التعلم دائمًا</li><li><b>ب.</b> يُسمح به بلا قيد، فهو يرفع أداء التمرين</li><li><b>ج.</b> يُسمح به بضوابط، ويُتحقق من المهارة دونه</li><li><b>د.</b> يُسمح به ويكفي أداء التمرين دليلًا للشهادة</li></ul></li>
<li><p>شهادة داخلية لموظفي خدمة العملاء تدّعي أن حاملها «يرد على شكوى غاضبة وفق قواعد الخدمة». أي تقييم يشهد بذلك؟</p><ul><li><b>أ.</b> رد مكتوب في البيت على شكوى نموذجية، مع إفصاح</li><li><b>ب.</b> محاكاة حية لشكوى أمام مقيِّم، ثم سؤالان عن الرد</li><li><b>ج.</b> اختبار قصير مراقب على قواعد الخدمة المكتوبة</li><li><b>د.</b> تقييم المدير المباشر لأداء الموظف العام في السنة</li></ul></li>
<li><p>تطلب المهمة المفتوحة من المرشح أن يرفق مسوداته وسجل محادثته مع المساعد. ما الفائدة الأولى لهذه الأدلة؟</p><ul><li><b>أ.</b> تثبت وحدها أن العمل من صنع المرشح نفسه</li><li><b>ب.</b> تغني عن المسار المراقب في الشهادة كلها</li><li><b>ج.</b> تفتح للمناقشة أسئلة لا يجيبها إلا صانعه</li><li><b>د.</b> تمكّن أداة الكشف من فحص السجل كله آليًّا</li></ul></li>
<li><p>إضافة سطر «يُمنع استخدام الذكاء الاصطناعي» إلى تعليمات اختبار منزلي غير مراقب تعيد إلى درجته صدقها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في برنامج شهادة داخلي، من يبت في تظلم مرشح رسب في المناقشة الشفهية؟</p><ul><li><b>أ.</b> لجنة لم تكتب البنود ولم تصحح ولم تناقش</li><li><b>ب.</b> مالك البرنامج، فهو أعرف الناس بمعاييره</li><li><b>ج.</b> المقيِّم الذي ناقش المرشح، فقد رأى الأداء</li><li><b>د.</b> كاتب البنود، فهو يعرف ما قُصد بها</li></ul></li>
<li><p>خطة شهادة: 70% لتقرير منزلي مفتوح، و30% لمناقشة مباشرة، والنجاح 60% من المجموع. ما المشكلة؟</p><ul><li><b>أ.</b> وزن المناقشة كبير على عدد المرشحين</li><li><b>ب.</b> التقرير المنزلي لا يجوز أن يدخل الدرجة أبدًا</li><li><b>ج.</b> النجاح بـ60% أقل من حد الاجتياز المعتاد</li><li><b>د.</b> يمكن النجاح دون أن يرى أحد المرشح يعمل</li></ul></li>
<li><p>شهادة إنجاز لدورة في السلامة المهنية تُمنح بعد حضور ورشتين وتسليم استبانة، ونصها: «مؤهل لإدارة السلامة في الموقع». ما الحكم وفق إطار معايير البرامج التدريبية؟</p><ul><li><b>أ.</b> شهادة الإنجاز لا تدّعي كفاءة دون تقييم</li><li><b>ب.</b> النص مقبول ما دامت الشهادة موقعة رقميًّا</li><li><b>ج.</b> النص مقبول ما دامت الاستبانة جزءًا من المتطلبات</li><li><b>د.</b> النص مقبول إن رُبطت الشهادة ببطاقة دور</li></ul></li>
<li><p>تحققت من توقيع شارة رقمية فوجدته صحيحًا، وحالتها لم تُلغَ. ماذا ثبت لك؟</p><ul><li><b>أ.</b> أن حاملها يملك المهارة المذكورة في عنوانها</li><li><b>ب.</b> أن الجهة المذكورة أصدرتها ولم تتغير بعدها</li><li><b>ج.</b> أن التقييم وراءها كان مراقبًا</li><li><b>د.</b> أن الجهة المصدرة معتمدة لدى جهة رسمية</li></ul></li>
<li><p>الشهادة المتراكمة لا تدّعي في أي متطلب أكثر مما يثبته المكون الذي قيّمه، ولو كانت المكونات الأخرى قوية.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>جهة توظيف تريد أن تفرز المتقدمين لوظائف مركز الاتصال بمقابلة صوتية يقيّمها نموذج لغوي، ويُستبعد آليًّا من يقل عن حد معين. ما الذي تشترطه قبل اعتماد ذلك؟</p><ul><li><b>أ.</b> نسبة دقة يعلنها المزوّد للتقييم الآلي</li><li><b>ب.</b> أن يُصحح مقيِّم بشري عينة عشوائية سنويًّا</li><li><b>ج.</b> إفصاحًا مسبقًا، ومراجعة بشرية قبل أي استبعاد</li><li><b>د.</b> ألا يُستعمل الذكاء الاصطناعي في أي تقييم أبدًا</li></ul></li>
<li><p>اختبار مراقب حد اجتيازه 17 من 24، وخطؤه المعياري للقياس نحو بندين. حصل مرشح للترقية على 16. ماذا تفعل؟</p><ul><li><b>أ.</b> ترسبه، فالحد معلن ومعروف مسبقًا</li><li><b>ب.</b> تنجحه، فالفرق بند واحد فقط</li><li><b>ج.</b> تطلب منه إعادة الاختبار نفسه فورًا</li><li><b>د.</b> تطلب دليلًا ثانيًا قبل أي قرار</li></ul></li>
<li><p>متوسط رضا المشاركين عن برنامج 4.7 من 5. أي قرار يخدمه هذا الرقم؟</p><ul><li><b>أ.</b> توسيع البرنامج إلى كل الإدارات</li><li><b>ب.</b> تعديل المحتوى والتنظيم</li><li><b>ج.</b> حساب العائد على استثمار البرنامج</li><li><b>د.</b> منح الشهادة لكل من أكمل البرنامج</li></ul></li>
<li><p>برنامج لمشرفي الصيانة: الأعطال المتكررة عند المشاركين من 20 إلى 14، وعند المقارنة من 22 إلى 19. ما تقدير فرق الفروق؟</p><ul><li><b>أ.</b> −6</li><li><b>ب.</b> −5</li><li><b>ج.</b> −3</li><li><b>د.</b> −9</li></ul></li>
<li><p>حين يرشح المديرون للبرنامج الأقوى أداءً، يبالغ الفرق بين المجموعتين بعد البرنامج في تقدير أثره.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>رضا المشاركين المرتفع دليل كافٍ على أنهم يطبقون ما تعلموه في العمل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>برنامج يطلب مالكه توسيعه بناءً على تقرير كتبه بنفسه. من يقيّم أثره قبل القرار؟</p><ul><li><b>أ.</b> محلل لا يتبع البرنامج، ويراجعه التدقيق</li><li><b>ب.</b> مالك البرنامج، بعد أن يضيف مجموعة مقارنة عادلة</li><li><b>ج.</b> المشاركون أنفسهم باستبانة تقويم ذاتي</li><li><b>د.</b> المزوّد الخارجي الذي قدم محتوى البرنامج</li></ul></li>
<li><p>المقاعد 40 والمؤهلون 120 في برنامج جديد. أي طريقة اختيار تجعل المقارنة أعدل؟</p><ul><li><b>أ.</b> ترشيح المديرين لأفضل 40 موظفًا</li><li><b>ب.</b> أسبقية التسجيل في البرنامج</li><li><b>ج.</b> مقارنة المشاركين بأنفسهم قبل البرنامج</li><li><b>د.</b> قرعة بين المؤهلين، والباقون لاحقًا</li></ul></li>
</ol>
